const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));

function mix(h1, h2, k) {
  const a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16);

  if (st === "GLASS") { g.fillStyle = hex(th.surface, th.dark ? .5 : .62); g.fill(); g.strokeStyle = hex("#FFFFFF", th.dark ? .18 : .7); g.lineWidth = 1.2; g.stroke(); }

function keypad(th, w, t, scene, top = 392) {

  const hatAt = (t, v = .07, open = false) => { const n = ac.createBufferSource(); n.buffer = NB; const hp = ac.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = open ? 6500 : 8000; const hg = ac.createGain(); hg.gain.setValueAtTime(v, t); hg.gain.exponentialRampToValueAtTime(.001, t + (open ? .22 : .045)); n.connect(hp); hp.connect(hg); hg.connect(master); n.start(t, rnd(t * 3) * 2); n.stop(t + .25); };
  const crashAt = t => { const n = ac.createBufferSource(); n.buffer = NB; const hp = ac.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 4500; const ng = ac.createGain(); ng.gain.setValueAtTime(.16, t); ng.gain.exponentialRampToValueAtTime(.001, t + 1.6); n.connect(hp); hp.connect(ng); ng.connect(master); n.start(t, rnd(t)); n.stop(t + 1.7); };
  const riser = (a, b) => { const n = ac.createBufferSource(); n.buffer = NB; n.loop = true; const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 3; bp.frequency.setValueAtTime(400, a); bp.frequency.exponentialRampToValueAtTime(9000, b); const ng = ac.createGain(); ng.gain.setValueAtTime(.001, a); ng.gain.exponentialRampToValueAtTime(.22, b - .02); ng.gain.linearRampToValueAtTime(0, b); n.connect(bp); bp.connect(ng); ng.connect(master); n.start(a); n.stop(b + .05); };

  for (let t = 0; t < DUR; t += .25) {
    const q = Math.round(t * 4) % 4;   // 0 = temps, 2 = contretemps (croches)
    const beatNo = Math.round(t * 2) % 4;
    if (inGroove(t)) {
      if (q === 0) kickAt(t);
      if (q === 0 && (beatNo === 1 || beatNo === 3)) clapAt(t);
      hatAt(t, q === 2 ? .09 : .045, q === 2 && beatNo % 2 === 1);
      // basse : contretemps + octave
      if (q !== 0) { const root = CH[chordAt(t)][0] / 2; tone(ac, pump, t, q === 2 ? root : root * 2, [[1, 1, "sawtooth"], [.5, .6, "sine"]], .004, .22, .3, { lp: 560, q: 4 }); }
      // stabs d'accord sur « et » de 2 et 4
      if (q === 2 && (beatNo === 1 || beatNo === 3) && t >= 20) for (const f of CH[chordAt(t)]) tone(ac, pump, t, f * 2, [[1, 1, "sawtooth"], [1, .8, "square"]], .003, .16, .045, { lp: 3200, detune: 6 });
    } else if (t >= 2 && t < 4 && q === 2) hatAt(t, .05);   // l'intro monte
  }
  // fills : caisse claire qui accélère avant les gros changements
  for (const h of [13.5, 29, 40]) for (let i = 0; i < 4; i++) clapAt(h - 1 + i * .25 + (i > 1 ? .0 : 0), .22 + i * .06);
  HITS.forEach(crashAt);
  riser(2, 4); riser(11.5, 13.5); riser(38, 40); riser(45, 47);
  // fin : coup + accord final
  kickAt(47, 1); kickAt(49, .6);

  // intro : ocarina
  [[.5, "5", .5], [1.0, "6", .5], [1.5, "8", 1.0], [3.0, "6", .25], [3.25, "8", .25], [3.5, "9", .45]].forEach(([t, k, d]) => play(ac, keys, NB, "ocarina", t, FREQ[k], d, .2));
  play(ac, keys, NB, "bell", .2, 523.25, 1, .12);
  // touches du clavier
  for (const e of EV) play(ac, keys, NB, e.ins, e.t, FREQ[e.k], e.d, e.ins === "piano" ? .36 : .3);
  // sonneries (le téléphone qui sonne, en rythme)
  for (const [a, b] of [[13.5, 15.4], [21.0, 22.35]]) for (let t = a; t < b; t += .25) { const f = Math.round(t * 4) % 2 ? 1318.5 : 1046.5; tone(ac, keys, t, f, [[1, 1, "sine"], [2, .2, "sine"]], .004, .14, .08); }
  play(ac, keys, NB, "bell", 15.4, 1046.5, 1, .14);       // décroché
  play(ac, keys, NB, "pluck", 18.1, 1318.5, .3, .25);     // haut-parleur
  play(ac, keys, NB, "blip", 22.35, 523.25, .2, .25);     // retourné
  // double appel, barre, partage
  for (let t = 25.5; t < 27.5; t += 1) { tone(ac, keys, t, 880, [[1, 1, "sine"]], .003, .12, .07); tone(ac, keys, t + .15, 880, [[1, 1, "sine"]], .003, .12, .07); }
  [27.5, TAP_BAR, 36.0].forEach(t => play(ac, keys, NB, "blip", t, 1046.5, .2, .22));
  // stats : barres qui montent (arpège)
  for (let i = 0; i < 8; i++) play(ac, keys, NB, "pluck", 29.15 + i * .125, CH[chordAt(29.2)][i % 3] * (i < 4 ? 2 : 4), .2, .14);
  // Wrapped : cloches
  [[33.5, 1046.5], [33.9, 1318.5], [34.4, 1568]].forEach(([t, f]) => play(ac, keys, NB, "bell", t, f, 1, .13));
  // carte : épingles
  PINS.forEach((p, i) => play(ac, keys, NB, "pluck", T_.map[0] + .2 + i * .25 + .3, CH[chordAt(37)][i % 3] * 2, .2, .16));
  // thèmes : un pluck par changement
  THEME_AT.slice(1).forEach(t => { const ch = CH[chordAt(t)]; play(ac, keys, NB, "pluck", t, ch[0] * 2, .3, .2); play(ac, keys, NB, "pluck", t + .06, ch[2] * 2, .3, .16); });
  // widgets
  play(ac, keys, NB, "piano", T_.widgets[0] + 1.4, FREQ["2"], .5, .32);
  // fin : ocarina + cloche
  [[47.25, "8", .5], [47.75, "6", .5], [48.25, "5", .5], [48.75, "8", 1.4]].forEach(([t, k, d]) => play(ac, keys, NB, "ocarina", t, FREQ[k], d, .22));
  play(ac, keys, NB, "bell", 48.75, 523.25, 1.6, .16); play(ac, keys, NB, "bell", 48.75, 783.99, 1.6, .1);
  return ac.startRendering();
}

/* =====================================================================
   APERÇU + EXPORT
   ===================================================================== */
let music = null, actx = null, src = null, playing = false, t0 = 0, cur = 0;
const seek = document.getElementById("seek"), tm = document.getElementById("tm"), st = document.getElementById("st");
function draw(t) { cur = t; frame(t); seek.value = t; tm.textContent = t.toFixed(2); }
async function ensureMusic() { if (!music) { st.textContent = "Musique…"; music = await renderMusic(); st.textContent = ""; } return music; }
function stop() { playing = false; if (src) { try { src.stop(); } catch (e) {} src = null; } document.getElementById("play").textContent = "▶ Aperçu"; }
document.getElementById("play").onclick = async () => {
  if (playing) return stop();
  await ensureMusic(); actx = actx || new AudioContext({ sampleRate: SR });
  src = actx.createBufferSource(); src.buffer = music; src.connect(actx.destination);
  const from = cur >= DUR - .05 ? 0 : cur; src.start(0, from); t0 = actx.currentTime - from; playing = true;
  document.getElementById("play").textContent = "⏸ Pause";
  const loop = () => { if (!playing) return; const t = actx.currentTime - t0; if (t >= DUR) { draw(DUR); return stop(); } draw(t); requestAnimationFrame(loop); };
  loop();
};
seek.oninput = () => { stop(); draw(+seek.value); };
document.getElementById("lang").onchange = e => { LANG = e.target.value; draw(cur); };
window.drawAt = t => draw(t);

async function exportMp4(lang) {
  LANG = lang; document.getElementById("lang").value = lang; stop();
  const buf = await ensureMusic();
  if (!window.Mp4Muxer) throw new Error("mp4-muxer n'a pas pu être chargé (connexion internet ?)");
  if (!window.VideoEncoder) throw new Error("ce navigateur ne sait pas encoder la vidéo (WebCodecs) : utilise Edge ou Chrome récent");
  let vcodec = "avc1.640028";
  if (!(await VideoEncoder.isConfigSupported({ codec: vcodec, width: W, height: H })).supported) vcodec = "avc1.4d0028";
  let acodec = "mp4a.40.2", mcodec = "aac";
  if (!(await AudioEncoder.isConfigSupported({ codec: acodec, sampleRate: SR, numberOfChannels: 2, bitrate: 192000 })).supported) { acodec = "opus"; mcodec = "opus"; }
  const muxer = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), video: { codec: "avc", width: W, height: H, frameRate: FPS }, audio: { codec: mcodec, numberOfChannels: 2, sampleRate: SR }, fastStart: "in-memory" });
  let err = null;
  const ve = new VideoEncoder({ output: (c, m) => muxer.addVideoChunk(c, m), error: e => err = e });
  ve.configure({ codec: vcodec, width: W, height: H, bitrate: 12e6, framerate: FPS });
  const ae = new AudioEncoder({ output: (c, m) => muxer.addAudioChunk(c, m), error: e => err = e });
  ae.configure({ codec: acodec, sampleRate: SR, numberOfChannels: 2, bitrate: 192000 });
  const L0 = buf.getChannelData(0), R0 = buf.getChannelData(1), CHK = 4800;
  for (let i = 0; i < buf.length; i += CHK) {
    const n = Math.min(CHK, buf.length - i), data = new Float32Array(n * 2); data.set(L0.subarray(i, i + n), 0); data.set(R0.subarray(i, i + n), n);
    const ad = new AudioData({ format: "f32-planar", sampleRate: SR, numberOfFrames: n, numberOfChannels: 2, timestamp: Math.round(i / SR * 1e6), data });
    ae.encode(ad); ad.close();
  }
  const N = DUR * FPS;
  for (let i = 0; i < N; i++) {
    if (err) throw err;
    frame(i / FPS);
    const vf = new VideoFrame(cv, { timestamp: Math.round(i * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
    ve.encode(vf, { keyFrame: i % (FPS * 2) === 0 }); vf.close();
    while (ve.encodeQueueSize > 8) await new Promise(r => setTimeout(r, 5));
    if (i % 15 === 0) { st.textContent = `${lang.toUpperCase()} : ${Math.round(i / N * 100)} %`; seek.value = i / FPS; await new Promise(r => setTimeout(r, 0)); }
  }
  await ve.flush(); await ae.flush(); muxer.finalize();
  if (err) throw err;
  const blob = new Blob([muxer.target.buffer], { type: "video/mp4" });
  const name = `Di-Allo-promo-${lang}.mp4`;
  let saved = false;
  if (location.protocol.startsWith("http")) { try { const r = await fetch("/save?name=" + encodeURIComponent(name), { method: "POST", body: blob }); saved = r.ok; } catch (e) {} }
  if (!saved) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
  st.textContent = `${name} : ${(blob.size / 1e6).toFixed(1)} Mo ${saved ? "enregistré" : "téléchargé"} (${vcodec}, ${acodec})`;
  return { name, size: blob.size, vcodec, acodec, saved };
}
window.exportMp4 = exportMp4;
document.getElementById("exp").onclick = async () => { try { await exportMp4(LANG); } catch (e) { st.textContent = "Erreur : " + e.message; console.error(e); } };

draw(+(qs.get("t") || 0));
Promise.all([document.fonts.ready, new Promise(r => icon.complete ? r() : (icon.onload = icon.onerror = r))]).then(async () => {
  await Promise.all(["Inter", "Pacifico", "Bebas Neue", "Yellowtail", "Cinzel", "Press Start 2P", "VT323", "Monoton", "Orbitron"].map(f => document.fonts.load(`400 20px "${f}"`).catch(() => {})));
  await Promise.all(["900", "800", "700", "600", "500", "300"].map(w => document.fonts.load(`${w} 20px Inter`).catch(() => {})));
  draw(cur);
});
